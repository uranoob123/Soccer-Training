<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Football IQ Trainer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap');
        html, body { margin: 0; overflow: hidden; background: #000; font-family: 'Montserrat', sans-serif; user-select: none; touch-action: none; -webkit-user-select: none; overscroll-behavior: none; }
        body { position: fixed; inset: 0; }
        
        /* UI HUD */
        #ui { position: absolute; top: 40px; left: 40px; color: white; pointer-events: none; z-index: 10; transition: opacity 0.3s; }
        h2 { font-size: 52px; font-weight: 900; margin: 0; line-height: 1; color: #fff; text-shadow: 0 4px 15px rgba(0,255,136,0.4); font-style: italic; letter-spacing: -1px; text-transform: uppercase;}
        .subtitle { color: #00ff88; font-weight: 700; letter-spacing: 3px; font-size: 14px; margin-bottom: 5px; text-transform: uppercase; transition: color 0.3s; }
        .controls-hint { font-size: 12px; color: #aaa; margin-top: 10px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px; backdrop-filter: blur(4px); display: inline-block; border: 1px solid rgba(255,255,255,0.1); }

        /* SETTINGS MENU */
        #settings-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.7); 
            display: none; z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }
        #settings-menu {
            width: 380px; background: rgba(15, 20, 25, 0.95); padding: 40px; border-radius: 24px;
            border: 1px solid rgba(0,255,136,0.3); color: white; box-shadow: 0 0 50px rgba(0,0,0,1); pointer-events: auto;
        }
        .menu-header { font-weight: 900; font-size: 28px; margin-bottom: 30px; text-align: center; font-style: italic; letter-spacing: -1px; color: #00ff88; }
        .setting-row { margin-bottom: 25px; }
        .label-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        label { font-size: 12px; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .val-indicator { color: #00ff88; font-weight: 900; font-size: 18px; }
        
        .toggle-container { display: flex; gap: 10px; }
        .toggle-btn { 
            flex: 1; padding: 12px; background: #222; border: 1px solid #444; color: #fff; 
            cursor: pointer; border-radius: 10px; font-weight: 700; transition: all 0.2s; text-align: center;
        }
        .toggle-btn.active { background: #00ff88; color: #000; border-color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.3); }
        .toggle-btn:hover { filter: brightness(1.2); }
        
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #00ff88; }

        /* BARS & FEEDBACK */
        .hud-container { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; pointer-events: none; transition: opacity 0.3s; }
        .hud-box { background: rgba(0,0,0,0.5); padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hud-label { color: #aaa; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; margin-bottom: 8px; }
        .bar-bg { width: 180px; height: 10px; background: rgba(0,0,0,0.8); border-radius: 5px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        
        #timer-bar { height: 100%; background: #fff; width: 100%; transition: width 0.1s linear; }
        #stamina-bar { height: 100%; background: #00d4ff; width: 100%; box-shadow: 0 0 10px #00d4ff; }
        #power-bar { height: 100%; background: linear-gradient(90deg, #00ff88, #ffcc00, #ff2222); width: 0%; transition: width 0.05s; box-shadow: 0 0 15px rgba(255, 34, 34, 0.5); }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background: rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; mix-blend-mode: difference; transition: transform 0.1s;
        }

        #feedback { 
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            display: none; z-index: 20; text-align: center; padding: 25px 80px; border-radius: 20px; 
            background: rgba(10,10,15,0.95); border: 2px solid white; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(255,255,255,0.05); backdrop-filter: blur(15px);
        }
        #fb-main { font-size: 4.5rem; font-weight: 900; font-style: italic; letter-spacing: 2px; line-height: 1; text-transform: uppercase; }
        .feedback-sub { font-size: 1.2rem; font-weight: 700; color: #fff; letter-spacing: 2px; margin-top: 15px; text-transform: uppercase; }
        #fb-details { font-size: 0.85rem; font-weight: 800; color: #888; margin-top: 12px; text-transform: uppercase; letter-spacing: 1.5px; }
        
        #overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.6) 100%); pointer-events: none; z-index: 5; }

        /* TOUCH CONTROLS (mobile) */
        #touch-look-layer { position: absolute; inset: 0; z-index: 8; touch-action: none; display: none; }

        #touch-controls { position: absolute; inset: 0; z-index: 15; display: none; pointer-events: none; }
        #touch-controls > * { pointer-events: auto; }

        #joystick-zone {
            position: absolute; left: 30px; bottom: 30px; width: 130px; height: 130px;
            border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25);
            touch-action: none;
        }
        #joystick-knob {
            position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
            border-radius: 50%; background: rgba(0,255,136,0.55); border: 2px solid rgba(0,255,136,0.9);
            box-shadow: 0 0 15px rgba(0,255,136,0.5); transition: transform 0.05s linear;
        }

        #btn-sprint, #btn-shoot, #btn-mobile-settings { touch-action: none; user-select: none; }

        #btn-sprint {
            position: absolute; right: 130px; bottom: 46px; width: 74px; height: 74px; border-radius: 50%;
            background: rgba(0,212,255,0.18); border: 2px solid rgba(0,212,255,0.6); color: #00d4ff;
            font-weight: 900; font-size: 11px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; text-align: center;
        }
        #btn-sprint.pressed { background: rgba(0,212,255,0.5); }

        #btn-shoot {
            position: absolute; right: 30px; bottom: 30px; width: 100px; height: 100px; border-radius: 50%;
            background: rgba(255,255,255,0.1); border: 3px solid rgba(255,255,255,0.6); color: #fff;
            font-weight: 900; font-size: 13px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; text-align: center;
        }
        #btn-shoot.pressed { background: rgba(255,34,34,0.45); border-color: #ff2222; }

        #btn-mobile-settings {
            position: absolute; top: 30px; right: 30px; width: 46px; height: 46px; border-radius: 12px;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 20px;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }

        body.touch-device #ui { top: 20px; left: 20px; }
        body.touch-device h2 { font-size: 34px; }
        body.touch-device .subtitle { font-size: 11px; }
        body.touch-device .controls-hint { font-size: 10px; max-width: 220px; }
        body.touch-device .hud-container { bottom: 150px; gap: 10px; }
        body.touch-device .hud-box { padding: 8px 12px; }
        body.touch-device .bar-bg { width: 100px; }
        body.touch-device #feedback { padding: 20px 30px; width: 78vw; box-sizing: border-box; }
        body.touch-device #fb-main { font-size: 2.6rem; }
        body.touch-device #settings-menu { width: 88vw; padding: 28px; }
    </style>
</head>
<body>
    <div id="overlay"></div>
    
    <div id="ui">
        <div class="subtitle" id="scenario-banner">SCENARIO // LOADING...</div>
        <h2>FOOTBALL IQ TRAINER</h2>
        <div class="controls-hint">W/A/S/D: MOVE &nbsp;|&nbsp; SHIFT: SPRINT &nbsp;|&nbsp; SPACE: PASS/SHOOT &nbsp;|&nbsp; <b>ESC: SETTINGS</b></div>
    </div>

    <div id="settings-overlay">
        <div id="settings-menu">
            <div class="menu-header">MATCH SETTINGS</div>

            <div class="setting-row">
                <label>Your Position</label>
                <div class="toggle-container" style="margin-top: 10px;">
                    <button class="toggle-btn active" id="btn-pos-rnd" onclick="setPosition('random')">ANY</button>
                    <button class="toggle-btn" id="btn-pos-st" onclick="setPosition('st')">ST</button>
                    <button class="toggle-btn" id="btn-pos-cm" onclick="setPosition('cm')">CM</button>
                    <button class="toggle-btn" id="btn-pos-cb" onclick="setPosition('cb')">CB</button>
                </div>
            </div>
            
            <div class="setting-row" style="margin-top: 25px;">
                <label>Time of Day</label>
                <div class="toggle-container" style="margin-top: 10px;">
                    <button class="toggle-btn active" id="btn-day" onclick="setLighting('day')">DAY</button>
                    <button class="toggle-btn" id="btn-night" onclick="setLighting('night')">NIGHT</button>
                </div>
            </div>

            <div class="setting-row">
                <div class="label-flex">
                    <label>Defender Pressure</label>
                    <span class="val-indicator" id="diff-val">10</span>
                </div>
                <input type="range" id="diff-slider" min="1" max="300" value="10">
            </div>

            <button class="toggle-btn active" style="margin-top:20px; width: 100%;" onclick="toggleSettings()">RESUME MATCH</button>
        </div>
    </div>

    <div class="hud-container" id="hud">
        <div class="hud-box">
            <div class="hud-label">MATCH CLOCK</div>
            <div class="bar-bg"><div id="timer-bar"></div></div>
        </div>
        <div class="hud-box">
            <div class="hud-label">STAMINA</div>
            <div class="bar-bg"><div id="stamina-bar"></div></div>
        </div>
        <div class="hud-box">
            <div class="hud-label">KICK POWER</div>
            <div class="bar-bg"><div id="power-bar"></div></div>
        </div>
    </div>

    <div id="touch-look-layer"></div>
    <div id="touch-controls">
        <div id="joystick-zone"><div id="joystick-knob"></div></div>
        <div id="btn-sprint">SPRINT</div>
        <div id="btn-shoot">SHOOT</div>
        <div id="btn-mobile-settings">&#9881;</div>
    </div>

    <div id="crosshair"></div>
    <div id="feedback">
        <div id="fb-main">ELITE VISION</div>
        <div id="fb-sub" class="feedback-sub">DEFENSIVE LINES BROKEN</div>
        <div id="fb-details">PROG: 20M | DRIVE: 10M | LINES: 2</div>
    </div>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>

    <script type="module">
        import * as THREE from 'three';

        // --- GAME CONSTANTS ---
        const GRAVITY = 9.81, RESTITUTION = 0.75, ROLLING_FRICTION = 0.96; 
        const PW = 50, PL = 75; 
        const BALL_RADIUS = 0.22;
        const BASE_FOV = 80, SPRINT_FOV = 95;

        // --- TACTICAL FORMATION OFFSETS (4-3-3) ---
        const defOffsets = [
            {x: -10, z: 0},   // 0: LCB
            {x: 10, z: 0},    // 1: RCB
            {x: -30, z: 5},   // 2: LB
            {x: 30, z: 5},    // 3: RB
            {x: -15, z: 18},  // 4: LCM
            {x: 0, z: 14},    // 5: CDM
            {x: 15, z: 18},   // 6: RCM
            {x: -25, z: 35},  // 7: LW (Presser)
            {x: 0, z: 32},    // 8: ST (Presser)
            {x: 25, z: 35}    // 9: RW (Presser)
        ];

        const atkOffsets = [
            {x: -15, z: 25}, // 0: LCB (Stays back)
            {x: 15, z: 25},  // 1: RCB (Stays back)
            {x: 0, z: 15},   // 2: CDM (Passer, stays back)
            {x: -35, z: -5}, // 3: LB (Wide overlap)
            {x: 35, z: -5},  // 4: RB (Wide overlap)
            {x: -12, z: -10},// 5: LCM (Half space)
            {x: 12, z: -10}, // 6: RCM (Half space)
            {x: -25, z: -25},// 7: LW (Attacks deep)
            {x: 0, z: -25},  // 8: ST (Attacks deep)
            {x: 25, z: -25}  // 9: RW (Attacks deep)
        ];

        // --- STATE & SETTINGS ---
        const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        let touchMove = { x: 0, z: 0 }; // analog input from the virtual joystick
        let isPaused = false, timeOfDay = 'day', difficultyLevel = 10; 
        let selectedPosition = 'random'; 
        let currentDefensiveStyle = 'PRESS'; 
        let playerTacticalId = 8;
        let playerRole = 'teammate';

        // --- DOM ELEMENTS ---
        const diffSlider = document.getElementById('diff-slider');
        const diffVal = document.getElementById('diff-val');
        diffSlider.oninput = () => { 
            difficultyLevel = parseInt(diffSlider.value);
            diffVal.innerText = difficultyLevel; 
        };
        const fbContainer = document.getElementById('feedback');
        const fbMain = document.getElementById('fb-main');
        const fbSub = document.getElementById('fb-sub');
        const fbDetails = document.getElementById('fb-details');
        const crosshair = document.getElementById('crosshair');
        const settingsOverlay = document.getElementById('settings-overlay');

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Default Day
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.005);

        const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
        let cameraTargetPos = new THREE.Vector3();
        
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setPixelRatio(1);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        let ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        let sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 512; sunLight.shadow.mapSize.height = 512;
        sunLight.shadow.camera.left = -PW * 1.5; sunLight.shadow.camera.right = PW * 1.5;
        sunLight.shadow.camera.top = PL * 1.5; sunLight.shadow.camera.bottom = -PL * 1.5;
        sunLight.visible = true; // Default Day
        scene.add(sunLight);

        let floodlight = new THREE.DirectionalLight(0xaaaaff, 1.2);
        floodlight.position.set(20, 60, 20); floodlight.castShadow = true;
        floodlight.visible = false;
        scene.add(floodlight);

        window.setLighting = (type) => {
            timeOfDay = type;
            document.getElementById('btn-day').classList.toggle('active', type === 'day');
            document.getElementById('btn-night').classList.toggle('active', type === 'night');
            if (type === 'day') {
                scene.background.setHex(0x87ceeb); scene.fog.color.setHex(0x87ceeb);
                ambientLight.intensity = 0.8; sunLight.visible = true; floodlight.visible = false;
            } else {
                scene.background.setHex(0x050a10); scene.fog.color.setHex(0x050a10);
                ambientLight.intensity = 0.5; sunLight.visible = false; floodlight.visible = true;
            }
        };

        window.setPosition = (pos) => {
            selectedPosition = pos;
            document.getElementById('btn-pos-rnd').classList.toggle('active', pos === 'random');
            document.getElementById('btn-pos-st').classList.toggle('active', pos === 'st');
            document.getElementById('btn-pos-cm').classList.toggle('active', pos === 'cm');
            document.getElementById('btn-pos-cb').classList.toggle('active', pos === 'cb');
        };

        window.toggleSettings = () => {
            isPaused = !isPaused;
            settingsOverlay.style.display = isPaused ? 'flex' : 'none';
            if (!isPaused) { lastTime = performance.now(); if (!isTouchDevice) document.body.requestPointerLock(); } 
            else { if (!isTouchDevice) document.exitPointerLock(); }
        };

        // --- STADIUM & PITCH ---
        const pitchGroup = new THREE.Group();
        const darkGrass = new THREE.MeshStandardMaterial({ color: 0x1a4015, roughness: 1.0 });
        const lightGrass = new THREE.MeshStandardMaterial({ color: 0x1f4a19, roughness: 1.0 });
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(PW*2.5, PL*2.5), darkGrass);
        ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; pitchGroup.add(ground);

        for (let z = -PL; z < PL; z += 10) {
            const stripe = new THREE.Mesh(new THREE.PlaneGeometry(PW*2, 5), lightGrass);
            stripe.rotation.x = -Math.PI / 2; stripe.position.set(0, 0.01, z + 2.5);
            stripe.receiveShadow = true; pitchGroup.add(stripe);
        }

        const lineMat = new THREE.MeshBasicMaterial({ color: 0xeeeeee });
        function addLine(w, h, x, z) {
            const l = new THREE.Mesh(new THREE.PlaneGeometry(w, h), lineMat);
            l.rotation.x = -Math.PI / 2; l.position.set(x, 0.02, z); pitchGroup.add(l);
        }
        addLine(PW*2, 0.3, 0, 0); addLine(PW*2, 0.3, 0, -PL); addLine(PW*2, 0.3, 0, PL); 
        addLine(0.3, PL*2, -PW, 0); addLine(0.3, PL*2, PW, 0); 
        addLine(40, 0.3, 0, -PL + 16.5); addLine(40, 0.3, 0, PL - 16.5); 
        addLine(0.3, 16.5, -20, -PL + 8.25); addLine(0.3, 16.5, 20, -PL + 8.25); 

        const circle = new THREE.Mesh(new THREE.RingGeometry(9.15, 9.45, 32), lineMat);
        circle.rotation.x = -Math.PI / 2; circle.position.y = 0.02; pitchGroup.add(circle);
        
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x0a0f14, roughness: 0.8 });
        const topWallMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });
        function buildWall(w, d, x, z) {
            const b = new THREE.Mesh(new THREE.BoxGeometry(w, 2, d), wallMat);
            b.position.set(x, 1, z); b.receiveShadow = true; b.castShadow = true; pitchGroup.add(b);
            const top = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, d), topWallMat);
            top.position.set(x, 2.1, z); pitchGroup.add(top);
        }
        buildWall(PW*2 + 10, 1, 0, -PL - 5); buildWall(PW*2 + 10, 1, 0, PL + 5);
        buildWall(1, PL*2 + 10, -PW - 5, 0); buildWall(1, PL*2 + 10, PW + 5, 0);
        scene.add(pitchGroup);

        function createGoal(zPos, rotY) {
            const group = new THREE.Group();
            const postMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
            const netMat = new THREE.MeshBasicMaterial({ color: 0xcccccc, wireframe: true, transparent: true, opacity: 0.2 });
            const pGeo = new THREE.CylinderGeometry(0.08, 0.08, 2.44, 8);
            const lp = new THREE.Mesh(pGeo, postMat); lp.position.set(-3.66, 1.22, 0); lp.castShadow = true; group.add(lp);
            const rp = new THREE.Mesh(pGeo, postMat); rp.position.set(3.66, 1.22, 0); rp.castShadow = true; group.add(rp);
            const cb = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 7.32, 8), postMat);
            cb.rotation.z = Math.PI / 2; cb.position.set(0, 2.44, 0); cb.castShadow = true; group.add(cb);
            const backNet = new THREE.Mesh(new THREE.PlaneGeometry(7.32, 2.44), netMat);
            backNet.position.set(0, 1.22, -2); group.add(backNet);
            const topNet = new THREE.Mesh(new THREE.PlaneGeometry(7.32, 2), netMat);
            topNet.rotation.x = -Math.PI / 2; topNet.position.set(0, 2.44, -1); group.add(topNet);
            group.position.set(0, 0, zPos); group.rotation.y = rotY; scene.add(group);
        }
        createGoal(-PL, 0); createGoal(PL, Math.PI);

        // --- GAME STATE ---
        let teammates = [], defenders = [], ball = null, trailLine = null, trailPoints = [];
        let oppGoalKeeper = null; 
        let ballVel = new THREE.Vector3(), isBallInFlight = false, isRoundActive = false;
        let isReceivingPass = false, currentScenarioText = "", currentScenarioColor = "";
        let aimedReceiver = null, tacticalBestTeammate = null, idealScoreAtKick = -Infinity;
        
        // POSITIONS FOR FEEDBACK CALCULATION
        let playerVel = new THREE.Vector3(), playerPos = new THREE.Vector3(0, 0, 20);
        let playerPosAtKick = new THREE.Vector3(), playerPosAtReceive = new THREE.Vector3();
        
        let playerStamina = 100, isCharging = false, chargeValue = 0, yaw = 0, pitchRot = 0;
        let keys = { w: false, a: false, s: false, d: false, shift: false };
        let lastTime = performance.now(), matchClock = 20;
        let tackleImmunityTimer = 0; // Prevent instant tackles when gaining the ball

        // SEQUENCE TRACKING STATE
        let currentPossessionPasses = [];
        let currentPassRecord = null;

        // --- GLOBAL SHARED GEOMETRIES ---
        const ballGeo = new THREE.IcosahedronGeometry(BALL_RADIUS, 1);
        const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
        const trailMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2a679, roughness: 0.8 });
        const botTorsoGeo = new THREE.BoxGeometry(0.6, 0.7, 0.3); 
        const botShortsGeo = new THREE.BoxGeometry(0.6, 0.4, 0.3);
        const botLimbGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2); 
        const botHeadGeo = new THREE.SphereGeometry(0.22, 8, 8); 

        class PlayerBot {
            constructor(primaryColor, secondaryColor, role, idOffset) {
                this.group = new THREE.Group();
                this.role = role; this.id = idOffset;
                
                this.baseSpeed = (role === 'defender' || role === 'oppGoalie') ? 9.5 : 10.5;
                this.maxSprint = this.baseSpeed * 1.3;
                this.acceleration = 18.0;
                this.velocity = new THREE.Vector3(0,0,0);
                this.baseZ = 0; 
                this.tacticalTarget = new THREE.Vector3();

                this.shirtMat = new THREE.MeshStandardMaterial({ color: primaryColor, roughness: 0.8 });
                this.shortsMat = new THREE.MeshStandardMaterial({ color: secondaryColor, roughness: 0.8 });

                this.torso = new THREE.Mesh(botTorsoGeo, this.shirtMat); this.torso.position.y = 1.35; this.torso.castShadow = true;
                this.shorts = new THREE.Mesh(botShortsGeo, this.shortsMat); this.shorts.position.y = 0.8; this.shorts.castShadow = true;
                this.head = new THREE.Mesh(botHeadGeo, skinMat); this.head.position.y = 1.85; this.head.castShadow = true;

                this.legL = new THREE.Group(); this.legL.position.set(-0.15, 0.6, 0);
                const meshLL = new THREE.Mesh(botLimbGeo, skinMat); meshLL.position.y = -0.35; meshLL.castShadow = true; this.legL.add(meshLL);

                this.legR = new THREE.Group(); this.legR.position.set(0.15, 0.6, 0);
                const meshLR = new THREE.Mesh(botLimbGeo, skinMat); meshLR.position.y = -0.35; meshLR.castShadow = true; this.legR.add(meshLR);

                this.armL = new THREE.Group(); this.armL.position.set(-0.4, 1.6, 0);
                const meshAL = new THREE.Mesh(botLimbGeo, skinMat); meshAL.position.y = -0.35; meshAL.castShadow = true; this.armL.add(meshAL);

                this.armR = new THREE.Group(); this.armR.position.set(0.4, 1.6, 0);
                const meshAR = new THREE.Mesh(botLimbGeo, skinMat); meshAR.position.y = -0.35; meshAR.castShadow = true; this.armR.add(meshAR);

                this.group.add(this.torso, this.shorts, this.head, this.legL, this.legR, this.armL, this.armR);
                scene.add(this.group);
            }
            
            update(dt, timeSec, ballInFlight, pPos, isPressing = false, offsideLineZ = -75, playerYaw = 0, isClosestToBall = false, pressAngle = null, markTarget = null) {
                if (isPaused) return;
                
                let targetSpeed = this.baseSpeed; 
                let intensity = difficultyLevel / 100; 

                if (this.role === 'defender') {
                    let defLineZ = Math.max(-PL + 5, pPos.z - 15);
                    
                    if (currentDefensiveStyle === 'SPACE') {
                        defLineZ -= 15; 
                    }

                    let desiredX = defOffsets[this.id].x + (pPos.x * 0.15); 
                    let desiredZ = defLineZ + defOffsets[this.id].z;

                    desiredX += Math.sin(timeSec * 1.1 + this.id) * 3.0; 
                    desiredZ += Math.cos(timeSec * 0.8 + this.id) * 3.0; 

                    targetSpeed = 4.0 + (intensity * 6.5); 
                    
                    if (ballInFlight && ball) { 
                        if (isClosestToBall) {
                            this.tacticalTarget.copy(ball.position); 
                            targetSpeed = this.maxSprint; 
                        } else {
                            this.tacticalTarget.set(desiredX, 0, desiredZ - 5);
                            targetSpeed = this.baseSpeed;
                        }
                    } else if (isPressing) { 
                        if (pressAngle !== null) {
                            // Multiple defenders pressing at once: approach from assigned, spread-out
                            // angles around the player instead of all converging on the same point.
                            let standoff = 2.4;
                            this.tacticalTarget.set(pPos.x + Math.sin(pressAngle) * standoff, 0, pPos.z + Math.cos(pressAngle) * standoff);
                        } else {
                            this.tacticalTarget.copy(pPos);
                        }
                        let distToPlayer = this.group.position.distanceTo(pPos);
                        if (distToPlayer < 4.0) {
                            targetSpeed = 3.0; 
                            this.tacticalTarget.z -= 1.0; 
                        } else { targetSpeed += (intensity * 5.0); }
                    } else {
                        this.tacticalTarget.set(desiredX, 0, desiredZ);

                        if (markTarget) {
                            // Man-mark the assigned attacking outlet: sit goal-side of them, biased
                            // onto the passing lane from the ball carrier, so it's real personal
                            // coverage rather than a loose shared zone everyone drifts toward.
                            let laneT = 0.62; // weighted toward the marked man for tight coverage
                            let laneX = pPos.x + (markTarget.x - pPos.x) * laneT;
                            let laneZ = pPos.z + (markTarget.z - pPos.z) * laneT;
                            let markStrength = Math.min(1, 0.5 + intensity * 0.5);
                            this.tacticalTarget.x += (laneX - this.tacticalTarget.x) * markStrength;
                            this.tacticalTarget.z += (laneZ - this.tacticalTarget.z) * markStrength;
                        } else {
                            // No assignment available (more defenders than attacking outlets) —
                            // just hold defensive shape close to the ball rather than converging.
                            let distToPlayer = this.group.position.distanceTo(pPos);
                            if (distToPlayer < 15.0) {
                                this.tacticalTarget.x = pPos.x + (this.id % 2 === 0 ? -3 : 3);
                                this.tacticalTarget.z = pPos.z - 5;
                            }
                        }
                    }
                } 
                else if (this.role === 'teammate') {
                    let desiredX = atkOffsets[this.id].x;
                    let desiredZ = pPos.z + atkOffsets[this.id].z;

                    desiredX += Math.sin(timeSec * 0.9 + this.id) * 5.0; 
                    desiredZ -= Math.cos(timeSec * 0.7 + this.id) * 5.0; 

                    if (ballInFlight && ball) {
                        if (this === aimedReceiver) {
                            this.tacticalTarget.copy(ball.position); 
                            if (typeof ballVel !== 'undefined') this.tacticalTarget.add(ballVel.clone().multiplyScalar(0.4)); 
                            targetSpeed = this.maxSprint; 
                        } else { 
                            if (this.id < 3) {
                                this.tacticalTarget.set(desiredX + (pPos.x * 0.2), 0, Math.max(pPos.z + 10, desiredZ));
                            } else {
                                let safeZ = Math.max(desiredZ, offsideLineZ + 1.0); 
                                this.tacticalTarget.set(desiredX, 0, safeZ);
                            }
                        }
                    } else { 
                        if (this.id < 3) {
                            this.tacticalTarget.set(desiredX + (pPos.x * 0.2), 0, Math.max(pPos.z + 10, desiredZ));
                        } else {
                            let toMe = new THREE.Vector3().subVectors(this.group.position, pPos).normalize();
                            let lookDir = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), playerYaw);
                            let randomRun = (Math.sin(timeSec * 0.5 + this.id) > 0.85);

                            if ((toMe.angleTo(lookDir) < 0.6 || randomRun) && pPos.distanceTo(this.group.position) < 35 && !isReceivingPass) {
                                targetSpeed = this.maxSprint; 
                                desiredZ = offsideLineZ + 0.5; 
                            }
                            let safeZ = Math.max(desiredZ, offsideLineZ + 1.0); 
                            this.tacticalTarget.set(desiredX, 0, safeZ);
                        }
                    }
                } 
                else if (this.role === 'myGoalie') {
                    targetSpeed = 8.0;
                    if (ballInFlight && ball && this === aimedReceiver) {
                        this.tacticalTarget.copy(ball.position); targetSpeed = this.maxSprint;
                    } else { this.tacticalTarget.set(pPos.x * 0.3, 0, PL - 5); }
                } 
                else if (this.role === 'oppGoalie') {
                    targetSpeed = 9.0 + (intensity * 4.0);
                    if (ballInFlight && ball && ballVel.z < 0 && ball.position.z < 0) { 
                        let timeToGoal = Math.max(0.1, (this.baseZ - ball.position.z) / ballVel.z);
                        let predX = Math.max(-4.0, Math.min(4.0, ball.position.x + ballVel.x * timeToGoal)); 
                        this.tacticalTarget.set(predX, 0, this.baseZ); targetSpeed = 20.0; 
                    } else { this.tacticalTarget.set(pPos.x * 0.25, 0, this.baseZ); }
                }

                this.tacticalTarget.y = 0; 
                
                let direction = new THREE.Vector3().subVectors(this.tacticalTarget, this.group.position);
                let distToTarget = direction.length();
                
                if (distToTarget > 0.5) {
                    let desiredVelocity = direction.normalize().multiplyScalar(targetSpeed);
                    this.velocity.lerp(desiredVelocity, this.acceleration * dt);
                } else { this.velocity.lerp(new THREE.Vector3(0,0,0), this.acceleration * 1.5 * dt); }

                this.group.position.add(this.velocity.clone().multiplyScalar(dt));
                
                let currentSpeedMag = this.velocity.length();
                if (currentSpeedMag > 3.0) {
                    let targetRot = Math.atan2(this.velocity.x, this.velocity.z);
                    this.group.rotation.y += getShortestAngle(this.group.rotation.y, targetRot) * 8 * dt;
                } else {
                    let lookTarget = (ballInFlight && ball) ? ball.position : pPos;
                    let lookDir = new THREE.Vector3().subVectors(lookTarget, this.group.position);
                    let targetRot = Math.atan2(lookDir.x, lookDir.z);
                    this.group.rotation.y += getShortestAngle(this.group.rotation.y, targetRot) * 5 * dt;
                }

                let animSpeed = currentSpeedMag / dt;
                if (animSpeed > 1) {
                    let runCycle = timeSec * animSpeed * 1.2;
                    this.legL.rotation.x = Math.sin(runCycle) * 0.8; this.legR.rotation.x = -Math.sin(runCycle) * 0.8;
                    this.armL.rotation.x = -Math.sin(runCycle) * 0.8; this.armR.rotation.x = Math.sin(runCycle) * 0.8;
                    this.torso.rotation.y = Math.sin(runCycle) * 0.2;
                } else {
                    this.legL.rotation.x *= 0.9; this.legR.rotation.x *= 0.9;
                    this.armL.rotation.x *= 0.9; this.armR.rotation.x *= 0.9;
                    this.torso.rotation.y *= 0.9;
                }
            }
            dispose() { this.shirtMat.dispose(); this.shortsMat.dispose(); scene.remove(this.group); }
        }

        function getShortestAngle(current, target) {
            let diff = target - current;
            while (diff < -Math.PI) diff += Math.PI * 2; while (diff > Math.PI) diff -= Math.PI * 2;
            return diff;
        }

        function determineBestPassOptionAtKick() {
            let bestTeammate = null; let maxScore = -Infinity; const oppGoalZ = -PL; 

            teammates.forEach(t => {
                let dx = playerPos.x - t.group.position.x; let dz = playerPos.z - t.group.position.z;
                let distToPlayer = Math.sqrt(dx*dx + dz*dz);
                let receiverDistToGoal = Math.abs(t.group.position.z - oppGoalZ);
                let playerDistToGoal = Math.abs(playerPos.z - oppGoalZ);
                let forwardProgression = playerDistToGoal - receiverDistToGoal;
                
                let closestDefDist = Infinity;
                defenders.forEach(d => {
                    let dDist = t.group.position.distanceTo(d.group.position); if (dDist < closestDefDist) closestDefDist = dDist;
                });

                let linesBroken = 0;
                defenders.forEach(d => { if (d.group.position.z < playerPos.z && d.group.position.z > t.group.position.z) linesBroken++; });

                let score = 0;
                if (distToPlayer < 15) score -= 1000; else if (forwardProgression < 0) score -= 500; 
                else { score += forwardProgression * 2.0; score += linesBroken * 25.0; score += closestDefDist * 2.0; }

                if (score > maxScore) { maxScore = score; bestTeammate = t; }
            });
            return { teammate: bestTeammate, score: maxScore };
        }

        function clearSceneEntities() {
            if (ball) { scene.remove(ball); ball = null; }
            if (trailLine) { scene.remove(trailLine); if(trailLine.geometry) trailLine.geometry.dispose(); trailLine = null; }
            if (oppGoalKeeper) { oppGoalKeeper.dispose(); oppGoalKeeper = null; }
            teammates.forEach(t => t.dispose()); defenders.forEach(d => d.dispose());
            teammates = []; defenders = []; trailPoints = [];
        }

        function resetGame() {
            matchClock = 20.0; playerStamina = 100; chargeValue = 0; tackleImmunityTimer = 0;
            isBallInFlight = false; isCharging = false; isReceivingPass = true;
            playerVel.set(0,0,0); 

            // Clear absolute sequence pass history
            currentPossessionPasses = [];
            currentPassRecord = null;
            
            const zones = {
                'st': { name: "ATTACKING THIRD", color: "#ff2222", minZ: -35, maxZ: -15, roleId: 8 },
                'cm': { name: "MIDFIELD BATTLE", color: "#ffcc00", minZ: -5, maxZ: 15, roleId: 6 },
                'cb': { name: "DEFENSIVE BUILD-UP", color: "#00d4ff", minZ: 25, maxZ: 45, roleId: 1 }
            };
            
            let pRole = selectedPosition;
            if (pRole === 'random') {
                const roles = ['st', 'cm', 'cb'];
                pRole = roles[Math.floor(Math.random() * roles.length)];
            }
            
            const activeZone = zones[pRole];
            playerTacticalId = activeZone.roleId;
            playerRole = 'teammate';
            currentDefensiveStyle = Math.random() > 0.5 ? 'PRESS' : 'SPACE';
            currentScenarioText = "SCENARIO // " + activeZone.name + " (" + currentDefensiveStyle + ")";
            currentScenarioColor = activeZone.color;
            
            const banner = document.getElementById('scenario-banner');
            banner.innerText = "SCENARIO // INCOMING PASS";
            banner.style.color = "#00d4ff";
            
            let spawnZ = activeZone.minZ + Math.random() * (activeZone.maxZ - activeZone.minZ);
            playerPos.set(atkOffsets[activeZone.roleId].x + (Math.random()-0.5)*5, 0, spawnZ); 

            clearSceneEntities();

            let defLineDrop = currentDefensiveStyle === 'SPACE' ? 15 : 0;

            for(let i=0; i<10; i++) {
                if (i !== playerTacticalId) {
                    let t = new PlayerBot(0x00ff88, 0xffffff, 'teammate', i);
                    t.group.position.set(atkOffsets[i].x, 0, playerPos.z + atkOffsets[i].z);
                    teammates.push(t);
                }
                
                let d = new PlayerBot(0xff2222, 0x111111, 'defender', i);
                let dLine = Math.max(-PL + 5, playerPos.z - 15 - defLineDrop);
                d.group.position.set(defOffsets[i].x, 0, dLine + defOffsets[i].z);
                defenders.push(d);
            }

            let myGoalKeeper = new PlayerBot(0xff00ff, 0x111111, 'myGoalie', 10);
            myGoalKeeper.group.position.set(0, 0, PL - 8); teammates.push(myGoalKeeper);

            oppGoalKeeper = new PlayerBot(0xffff00, 0x111111, 'oppGoalie', 10);
            let distOffLine = Math.random() < 0.4 ? (Math.random() * 12 + 2) : 1; 
            oppGoalKeeper.baseZ = -PL + distOffLine;
            oppGoalKeeper.group.position.set(0, 0, oppGoalKeeper.baseZ);
            
            let passer = teammates.find(t => t.id === 2) || teammates.find(t => t.id === 5); 
            passer.group.position.set(playerPos.x + (Math.random() > 0.5 ? 5 : -5), 0, playerPos.z + 15);
            
            let pdx = passer.group.position.x - playerPos.x;
            let pdz = passer.group.position.z - playerPos.z;
            yaw = Math.atan2(-pdx, -pdz); 
            pitchRot = 0;
            cameraTargetPos.copy(playerPos).setY(1.8);
            camera.rotation.set(pitchRot, yaw, 0, 'YXZ'); 
            
            ball = new THREE.Mesh(ballGeo, ballMat); 
            ball.castShadow = true; scene.add(ball);
            ball.position.copy(passer.group.position); ball.position.y = BALL_RADIUS;
            
            let toP = new THREE.Vector3().subVectors(playerPos, ball.position);
            toP.y = 0; let dist = toP.length(); toP.normalize();
            ballVel.copy(toP).multiplyScalar(dist / 1.1); 
            ballVel.y = 1.5; 

            fbContainer.style.display = 'none'; crosshair.style.transform = 'translate(-50%, -50%) scale(1)';
            isRoundActive = true;
        }

        function fireBall() {
            isBallInFlight = true; playerPosAtKick.copy(playerPos);
            let camDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            
            let evaluation = determineBestPassOptionAtKick();
            tacticalBestTeammate = evaluation.teammate; idealScoreAtKick = evaluation.score;

            let minScore = Infinity; aimedReceiver = teammates[0];
            teammates.forEach(t => {
                let toTeammate = new THREE.Vector3().subVectors(t.group.position, playerPos);
                let dist = toTeammate.length(); let angle = camDir.angleTo(toTeammate.clone().normalize());
                if (angle < Math.PI / 2.5) { 
                    let passScore = (Math.sin(angle) * dist) + (dist * 0.15); 
                    if (passScore < minScore) { minScore = passScore; aimedReceiver = t; }
                }
            });

            // Calculate target details to evaluate the quality of this choice
            let chosenLinesBroken = 0;
            let chosenForwardProgression = 0;
            let chosenScore = 0;
            if (aimedReceiver) {
                const oppGoalZ = -PL;
                let dx = playerPos.x - aimedReceiver.group.position.x; let dz = playerPos.z - aimedReceiver.group.position.z;
                let distToPlayer = Math.sqrt(dx*dx + dz*dz);
                let receiverDistToGoal = Math.abs(aimedReceiver.group.position.z - oppGoalZ);
                let playerDistToGoal = Math.abs(playerPos.z - oppGoalZ);
                chosenForwardProgression = playerDistToGoal - receiverDistToGoal;
                
                let closestDefDist = Infinity;
                defenders.forEach(d => {
                    let dDist = aimedReceiver.group.position.distanceTo(d.group.position); if (dDist < closestDefDist) closestDefDist = dDist;
                });
                defenders.forEach(d => { if (d.group.position.z < playerPos.z && d.group.position.z > aimedReceiver.group.position.z) chosenLinesBroken++; });

                if (distToPlayer < 15) chosenScore = -1000; 
                else if (chosenForwardProgression < 0) chosenScore = -500; 
                else { chosenScore = chosenForwardProgression * 2.0 + chosenLinesBroken * 25.0 + closestDefDist * 2.0; }
            }

            // Create temporary tracking object for the active flight
            currentPassRecord = {
                aimedReceiver: aimedReceiver,
                chosenScore: chosenScore,
                maxScore: evaluation.score,
                forwardProgression: chosenForwardProgression,
                linesBroken: chosenLinesBroken,
                completed: false,
                intercepted: false
            };

            ball = new THREE.Mesh(ballGeo, ballMat); ball.castShadow = true; scene.add(ball);
            ball.position.copy(playerPos).add(new THREE.Vector3(0, 0.5, 0)).add(camDir.clone().multiplyScalar(1.2));
            
            let chargeMultiplier = Math.pow(chargeValue, 1.5); let kickForce = 18 + (chargeMultiplier * 45);
            ballVel.copy(camDir).multiplyScalar(kickForce); ballVel.y += 3 + (chargeValue * 8); 

            const trailGeo = new THREE.BufferGeometry();
            trailLine = new THREE.Line(trailGeo, trailMat); scene.add(trailLine);
            crosshair.style.transform = 'translate(-50%, -50%) scale(1)';
        }

        function switchPossessionTo(t) {
            isBallInFlight = false;
            if (trailLine) { scene.remove(trailLine); if(trailLine.geometry) trailLine.geometry.dispose(); trailLine = null; }
            trailPoints = [];
            if (ball) { scene.remove(ball); ball = null; }

            // Log successful pass to sequence history
            if (currentPassRecord) {
                currentPassRecord.completed = true;
                currentPossessionPasses.push(currentPassRecord);
                currentPassRecord = null;
            }

            let oldPlayerPos = playerPos.clone();
            let newPlayerPos = t.group.position.clone();

            let oldPlayerId = playerTacticalId;
            let oldPlayerRole = playerRole;

            playerTacticalId = t.id;
            playerRole = t.role;

            t.id = oldPlayerId;
            t.role = oldPlayerRole;

            t.group.position.copy(oldPlayerPos);
            t.velocity.set(0, 0, 0);

            playerPos.copy(newPlayerPos);
            playerVel.set(0, 0, 0);

            playerPosAtReceive.copy(playerPos);
            tackleImmunityTimer = 1.0; // Give 1 second immunity after passing and switching control

            matchClock = 20.0;
            chargeValue = 0;
            isCharging = false;

            const banner = document.getElementById('scenario-banner');
            banner.innerText = "POSSESSION RETAINED // BUILD ATTACK";
            banner.style.color = "#00ff88";
        }

        function getCoachAssessment() {
            if (currentPossessionPasses.length === 0) {
                return { grade: "N/A", sub: "", details: "" };
            }

            let n = currentPossessionPasses.length;
            let completedCount = 0, interceptedCount = 0;
            let totalLinesBroken = 0, totalProgression = 0;
            let decisionSum = 0, executionSum = 0;

            currentPossessionPasses.forEach(p => {
                // DECISION: how close was the chosen option to the best one actually available,
                // regardless of whether it came off. A well-read pass that gets cut out is still
                // a good decision — that's a coaching distinction, not just a stat.
                let maxS = Math.max(1, p.maxScore);
                let chS = Math.max(0, p.chosenScore);
                let decisionPct = Math.min(100, (chS / maxS) * 100);
                decisionSum += decisionPct;

                // EXECUTION: did the pass actually reach its man, cleanly.
                let execPct;
                if (p.completed) {
                    execPct = 100; completedCount++;
                    totalLinesBroken += p.linesBroken;
                    totalProgression += Math.max(0, p.forwardProgression);
                } else if (p.intercepted) {
                    execPct = 10; interceptedCount++;
                } else {
                    execPct = 35; // wayward: out of bounds / died before reaching anyone
                }
                executionSum += execPct;
            });

            let avgDecision = decisionSum / n;
            let avgExecution = executionSum / n;
            let overall = avgDecision * 0.65 + avgExecution * 0.35;

            function letterFor(score) {
                if (score >= 90) return "A+"; if (score >= 80) return "A"; if (score >= 65) return "B";
                if (score >= 45) return "C"; if (score >= 25) return "D"; return "F";
            }
            let decisionGrade = letterFor(avgDecision);
            let executionGrade = letterFor(avgExecution);
            let overallGrade = letterFor(overall);

            // Coach's voice — the specific note depends on WHERE the problem is, same as a real debrief.
            let comment;
            let dHigh = avgDecision >= 75, dLow = avgDecision < 45;
            let eHigh = avgExecution >= 75, eLow = avgExecution < 45;

            if (interceptedCount >= 2) {
                comment = "You keep threading it into covered lanes. Check who's shadowing the pass before you commit to it.";
            } else if (dHigh && eHigh) {
                comment = "That's the picture I want — good read, clean execution. Keep playing like that.";
            } else if (dHigh && eLow) {
                comment = "Right idea every time, execution's letting you down. Slow the pass down and pick your weight.";
            } else if (dLow && eHigh) {
                comment = "Technically tidy, but you're not scanning first. Check your shoulder before you receive.";
            } else if (dLow) {
                comment = "Rushed decisions with no real pressure on you. Take the extra half-second to find the better option.";
            } else {
                comment = "Solid, unspectacular. Keep building — take the higher-value option when it's actually on.";
            }

            let details = `DECISION: ${decisionGrade} | EXECUTION: ${executionGrade} | ${completedCount}/${n} COMPLETED | ${totalLinesBroken} LINES BROKEN | ${Math.round(totalProgression)}m PROG`;
            return { grade: overallGrade, sub: comment, details };
        }

        function triggerFeedback(mainText, subText, detailsText, color, delay = 4500) {
            if (!isRoundActive) return; isRoundActive = false; 

            // A kick that never reached anyone (went out of bounds, died mid-flight) used to just
            // vanish from the stats. Flush it in as a wayward pass so the coach actually sees it —
            // unless this was a shot attempt on goal, which isn't a passing decision to grade here.
            const isShotOutcome = (mainText === "GOAL!" || mainText === "MISSED SHOT" || mainText === "SAVED!");
            if (currentPassRecord) {
                if (!isShotOutcome) currentPossessionPasses.push(currentPassRecord);
                currentPassRecord = null;
            }
            
            let rating = getCoachAssessment();
            
            // If the sequence included passes, overwrite the UI display to present the coach's grade
            if (rating.grade !== "N/A") {
                fbMain.innerText = `COACH GRADE: ${rating.grade}`;
                fbSub.innerText = rating.sub;
                fbDetails.innerText = `${rating.details} | ${mainText}${detailsText ? ' — ' + detailsText : ''}`;
                
                // Color override matching the grade bracket dynamic
                if (rating.grade.startsWith("A")) color = "#00ff88";
                else if (rating.grade.startsWith("B")) color = "#00d4ff";
                else if (rating.grade.startsWith("C")) color = "#ffcc00";
                else color = "#ff2222";
            } else {
                fbMain.innerText = mainText; 
                fbSub.innerText = subText;
                fbDetails.innerText = detailsText;
            }

            fbContainer.style.borderColor = color; fbMain.style.color = color;
            fbContainer.style.boxShadow = `0 20px 60px rgba(0,0,0,0.9), inset 0 0 30px ${color}33`;
            fbContainer.style.display = 'block';
            for (let key in keys) keys[key] = false; setTimeout(resetGame, delay);
        }

        function evaluateShotResult(isGoal) {
            let distToGoal = playerPosAtKick.distanceTo(new THREE.Vector3(0, 0, -PL));
            
            let mainText = isGoal ? "GOAL!" : "MISSED SHOT";
            let subText = ""; let color = isGoal ? "#00ff88" : "#ff4444";
            let elitePassAvailable = idealScoreAtKick > 115;

            if (isGoal) {
                if (distToGoal > 35) { subText = "WORLD CLASS LOB!"; } 
                else if (distToGoal > 20) { subText = "ABSOLUTE SCREAMER!"; } 
                else { subText = "CLINICAL FINISH!"; }
            } else {
                if (distToGoal > 45) { subText = "POOR DECISION - WAY TOO FAR"; } 
                else if (elitePassAvailable && distToGoal > 25) { subText = "SELFISH - MISSED OPEN TEAMMATE"; } 
                else if (distToGoal <= 28 && !elitePassAvailable) { subText = "UNLUCKY - RIGHT IDEA TO SHOOT"; } 
                else { subText = "POOR EXECUTION"; }
            }

            if (tacticalBestTeammate && elitePassAvailable && distToGoal > 25 && !isGoal) {
                tacticalBestTeammate.shirtMat.color.setHex(0xffff00); 
            }
            triggerFeedback(mainText, subText, `DIST: ${Math.round(distToGoal)}m`, color, 4500);
        }

        function startCharge() {
            if (!isPaused && !isBallInFlight && isRoundActive && !isReceivingPass) isCharging = true;
        }
        function releaseCharge() {
            if (isCharging) { isCharging = false; fireBall(); }
        }

        window.addEventListener('keydown', e => { 
            if(e.code === 'Escape') { toggleSettings(); return; }
            if(isPaused) return;
            if(e.code === 'KeyW') keys.w = true; if(e.code === 'KeyS') keys.s = true;
            if(e.code === 'KeyA') keys.a = true; if(e.code === 'KeyD') keys.d = true;
            if(e.code === 'ShiftLeft') keys.shift = true;
            if(e.code === 'Space') startCharge();
        });
        window.addEventListener('keyup', e => { 
            if(isPaused) return;
            if(e.code === 'KeyW') keys.w = false; if(e.code === 'KeyS') keys.s = false;
            if(e.code === 'KeyA') keys.a = false; if(e.code === 'KeyD') keys.d = false;
            if(e.code === 'ShiftLeft') keys.shift = false;
            if(e.code === 'Space') releaseCharge();
        });
        document.addEventListener('mousemove', e => { 
            if (document.pointerLockElement && !isPaused) { 
                yaw -= e.movementX * 0.002; 
                pitchRot = Math.max(-0.8, Math.min(0.8, pitchRot - e.movementY * 0.002)); 
            } 
        });
        document.addEventListener('click', () => { 
            if (!isPaused && !isTouchDevice) document.body.requestPointerLock(); 
        });

        // --- TOUCH CONTROLS SETUP (mobile) ---
        if (isTouchDevice) {
            document.body.classList.add('touch-device');
            document.getElementById('touch-controls').style.display = 'block';
            document.getElementById('touch-look-layer').style.display = 'block';
            document.querySelector('.controls-hint').innerHTML = 'DRAG SCREEN: LOOK &nbsp;|&nbsp; JOYSTICK: MOVE &nbsp;|&nbsp; HOLD SHOOT: PASS/SHOOT';

            // Drag-to-look (replaces mouse pointer lock, which isn't available on touch)
            const lookLayer = document.getElementById('touch-look-layer');
            let lookTouchId = null, lastLookX = 0, lastLookY = 0;
            lookLayer.addEventListener('touchstart', e => {
                const t = e.changedTouches[0];
                lookTouchId = t.identifier; lastLookX = t.clientX; lastLookY = t.clientY;
            }, { passive: true });
            lookLayer.addEventListener('touchmove', e => {
                if (isPaused) return;
                for (const t of e.changedTouches) {
                    if (t.identifier !== lookTouchId) continue;
                    let dx = t.clientX - lastLookX, dy = t.clientY - lastLookY;
                    lastLookX = t.clientX; lastLookY = t.clientY;
                    yaw -= dx * 0.005;
                    pitchRot = Math.max(-0.8, Math.min(0.8, pitchRot - dy * 0.005));
                }
            }, { passive: true });
            lookLayer.addEventListener('touchend', e => {
                for (const t of e.changedTouches) if (t.identifier === lookTouchId) lookTouchId = null;
            }, { passive: true });

            // Virtual joystick (movement)
            const joyZone = document.getElementById('joystick-zone');
            const joyKnob = document.getElementById('joystick-knob');
            let joyTouchId = null, joyCenter = { x: 0, y: 0 };
            const JOY_RADIUS = 50;
            joyZone.addEventListener('touchstart', e => {
                const t = e.changedTouches[0];
                const rect = joyZone.getBoundingClientRect();
                joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
                joyTouchId = t.identifier;
            }, { passive: true });
            joyZone.addEventListener('touchmove', e => {
                for (const t of e.changedTouches) {
                    if (t.identifier !== joyTouchId) continue;
                    let dx = t.clientX - joyCenter.x, dy = t.clientY - joyCenter.y;
                    let dist = Math.min(JOY_RADIUS, Math.hypot(dx, dy));
                    let ang = Math.atan2(dy, dx);
                    let kx = Math.cos(ang) * dist, ky = Math.sin(ang) * dist;
                    joyKnob.style.transform = `translate(${kx}px, ${ky}px)`;
                    touchMove.x = kx / JOY_RADIUS; touchMove.z = ky / JOY_RADIUS;
                }
            }, { passive: true });
            const releaseJoystick = e => {
                for (const t of e.changedTouches) {
                    if (t.identifier !== joyTouchId) continue;
                    joyTouchId = null; touchMove.x = 0; touchMove.z = 0;
                    joyKnob.style.transform = 'translate(0px, 0px)';
                }
            };
            joyZone.addEventListener('touchend', releaseJoystick, { passive: true });
            joyZone.addEventListener('touchcancel', releaseJoystick, { passive: true });

            // Sprint (hold)
            const sprintBtn = document.getElementById('btn-sprint');
            sprintBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.shift = true; sprintBtn.classList.add('pressed'); });
            sprintBtn.addEventListener('touchend', e => { e.preventDefault(); keys.shift = false; sprintBtn.classList.remove('pressed'); });
            sprintBtn.addEventListener('touchcancel', e => { keys.shift = false; sprintBtn.classList.remove('pressed'); });

            // Shoot / pass (hold to charge, release to kick)
            const shootBtn = document.getElementById('btn-shoot');
            shootBtn.addEventListener('touchstart', e => { e.preventDefault(); startCharge(); shootBtn.classList.add('pressed'); });
            shootBtn.addEventListener('touchend', e => { e.preventDefault(); releaseCharge(); shootBtn.classList.remove('pressed'); });
            shootBtn.addEventListener('touchcancel', e => { releaseCharge(); shootBtn.classList.remove('pressed'); });

            // Settings (gear icon replaces ESC key)
            document.getElementById('btn-mobile-settings').addEventListener('touchstart', e => { e.preventDefault(); toggleSettings(); });
        }

        function animate(now) {
            requestAnimationFrame(animate);
            let dt = Math.min((now - lastTime) / 1000, 0.05); lastTime = now;
            let timeSec = now * 0.001;

            if (isPaused) return; 

            camera.rotation.set(pitchRot, yaw, 0, 'YXZ');
            
            if (isRoundActive) {
                if (tackleImmunityTimer > 0) tackleImmunityTimer -= dt;
                
                if (isReceivingPass && ball) {
                    ballVel.y -= GRAVITY * dt;
                    ball.position.add(ballVel.clone().multiplyScalar(dt));
                    ball.rotation.x += ballVel.z * dt; ball.rotation.z -= ballVel.x * dt;

                    if (ball.position.y <= BALL_RADIUS) {
                        ball.position.y = BALL_RADIUS; ballVel.y *= -RESTITUTION;
                        ballVel.x *= ROLLING_FRICTION; ballVel.z *= ROLLING_FRICTION;
                        if (Math.abs(ballVel.y) < 0.5) ballVel.y = 0;
                    }

                    let toP = new THREE.Vector3().subVectors(playerPos, ball.position);
                    toP.y = 0;
                    if (toP.length() > 1.4) {
                        let desired = toP.normalize().multiplyScalar(15);
                        ballVel.x += (desired.x - ballVel.x) * dt * 5.0;
                        ballVel.z += (desired.z - ballVel.z) * dt * 5.0;
                    } else if (ball.position.y < 1.5) {
                        scene.remove(ball); ball = null; isReceivingPass = false;
                        playerPosAtReceive.copy(playerPos);
                        tackleImmunityTimer = 1.0; // Give 1 second immunity after receiving initial pass
                        
                        const banner = document.getElementById('scenario-banner');
                        banner.innerText = currentScenarioText; banner.style.color = currentScenarioColor;
                    }
                }

                if (!isBallInFlight) {
                    if (!isReceivingPass) {
                        matchClock -= dt; 
                        if (matchClock <= 0) triggerFeedback("TIME EXPIRED", "HELD BALL TOO LONG", `HELD FOR: 20.0s`, "#ff2222");

                        let input = new THREE.Vector3();
                        if (keys.w) input.z -= 1; if (keys.s) input.z += 1;
                        if (keys.a) input.x -= 1; if (keys.d) input.x += 1;
                        input.x += touchMove.x; input.z += touchMove.z;
                        if (input.length() > 1) input.normalize();
                        if (input.lengthSq() > 0) input.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);

                        let isSprinting = keys.shift && playerStamina > 0; let accel = isSprinting ? 28 : 15; let maxSpd = isSprinting ? 14 : 7;

                        if (input.lengthSq() > 0) {
                            playerVel.add(input.multiplyScalar(accel * dt)); playerVel.clampLength(0, maxSpd);
                            if (isSprinting) playerStamina = Math.max(0, playerStamina - 30 * dt);
                        } else {
                            playerVel.multiplyScalar(Math.pow(0.005, dt)); playerStamina = Math.min(100, playerStamina + 15 * dt);
                        }

                        let targetFOV = isSprinting && input.lengthSq() > 0 ? SPRINT_FOV : BASE_FOV;
                        camera.fov += (targetFOV - camera.fov) * 10 * dt; camera.updateProjectionMatrix();
                    } else {
                        // Keep player perfectly static while waiting for incoming pass control
                        playerVel.set(0, 0, 0);
                        camera.fov += (BASE_FOV - camera.fov) * 10 * dt; camera.updateProjectionMatrix();
                    }

                    playerPos.add(playerVel.clone().multiplyScalar(dt));
                    playerPos.x = Math.max(-PW + 1, Math.min(PW - 1, playerPos.x)); playerPos.z = Math.max(-PL + 1, Math.min(PL - 1, playerPos.z));
                }

                document.getElementById('timer-bar').style.width = Math.max(0, matchClock/20*100) + "%";
                document.getElementById('stamina-bar').style.width = playerStamina + "%";
                document.getElementById('stamina-bar').style.background = playerStamina < 20 ? "#ff2222" : "#00d4ff";
                document.getElementById('stamina-bar').style.boxShadow = playerStamina < 20 ? "0 0 10px #ff2222" : "0 0 10px #00d4ff";
                
                if (isCharging) {
                    chargeValue = Math.min(1, chargeValue + dt * 2.5);
                    if(chargeValue > 0.95) crosshair.style.transform = `translate(-50%, -50%) scale(${1 + Math.sin(timeSec*20)*0.3})`;
                }
                document.getElementById('power-bar').style.width = (chargeValue * 100) + "%";

                let closestDefToBall = null;
                let minBallDist = Infinity;
                if (isBallInFlight && ball) {
                    defenders.forEach(d => {
                        let dist = d.group.position.distanceTo(ball.position);
                        if (dist < minBallDist) {
                            minBallDist = dist;
                            closestDefToBall = d;
                        }
                    });
                }

                if (isBallInFlight && ball) {
                    ballVel.y -= GRAVITY * dt; ballVel.multiplyScalar(1 - (0.3 * dt)); 
                    ball.position.add(ballVel.clone().multiplyScalar(dt));
                    ball.rotation.x += ballVel.z * dt; ball.rotation.z -= ballVel.x * dt;

                    trailPoints.push(ball.position.clone());
                    if (trailPoints.length > 50) trailPoints.shift(); trailLine.geometry.setFromPoints(trailPoints);

                    if (ball.position.y <= BALL_RADIUS) {
                        ball.position.y = BALL_RADIUS; ballVel.y *= -RESTITUTION;
                        ballVel.x *= ROLLING_FRICTION; ballVel.z *= ROLLING_FRICTION;
                        if (Math.abs(ballVel.y) < 0.5) ballVel.y = 0;
                    }

                    let passCompleted = false;

                    if (ball.position.z <= -PL + BALL_RADIUS) {
                        passCompleted = true;
                        let isGoal = Math.abs(ball.position.x) < 3.66 && ball.position.y < 2.44;
                        if (isGoal) {
                            ballVel.set(0,0,0); ball.position.z = Math.max(ball.position.z, -PL - 1.5);
                        }
                        evaluateShotResult(isGoal);
                    } else if (Math.abs(ball.position.x) >= PW || ball.position.z >= PL) {
                        passCompleted = true; triggerFeedback("OUT OF BOUNDS", "WASTED POSSESSION", "", "#ff4444");
                    }

                    if (oppGoalKeeper && !passCompleted && ball.position.distanceTo(oppGoalKeeper.group.position) < 2.2 && ball.position.y < 3.0) {
                        passCompleted = true; ballVel.set(0, 0, 0);
                        ball.position.copy(oppGoalKeeper.group.position); ball.position.y = BALL_RADIUS; ball.position.z += 0.6; 
                        triggerFeedback("SAVED!", "KEEPER DENIES YOU", "", "#ffcc00");
                    }

                    teammates.forEach(t => {
                        if (!passCompleted && ball.position.distanceTo(t.group.position) < 2.5 && ball.position.y < 2.5) {
                            passCompleted = true; ballVel.set(0, 0, 0);
                            let toBall = ball.position.clone().sub(t.group.position).normalize();
                            ball.position.copy(t.group.position).add(toBall.multiplyScalar(0.6));
                            ball.position.y = BALL_RADIUS; switchPossessionTo(t);
                        }
                    });

                    defenders.forEach(d => {
                        if (!passCompleted && ball.position.distanceTo(d.group.position) < 2.0 && ball.position.y < 2.5) {
                            passCompleted = true; ballVel.set(0, 0, 0);
                            ball.position.copy(d.group.position); ball.position.y = BALL_RADIUS; ball.position.z -= 0.6; 
                            
                            // Log cut out pass to history before resetting
                            if (currentPassRecord) {
                                currentPassRecord.intercepted = true;
                                currentPossessionPasses.push(currentPassRecord);
                                currentPassRecord = null;
                            }
                            triggerFeedback("INTERCEPTED", "POOR DECISION", "", "#ff2222");
                        }
                    });

                    if (!passCompleted && ballVel.length() < 0.5 && ball.position.y <= BALL_RADIUS + 0.1) {
                        triggerFeedback("DEAD BALL", "DID NOT REACH TARGET", "", "#aaa");
                    }
                }

                let closestDef = null; let minDist = Infinity;
                let closestGoalSideDef = null; let minGoalSideDist = Infinity;
                let lastDefenderZ = 75; 

                defenders.forEach(d => {
                    let dist2D = d.group.position.distanceTo(playerPos); 
                    if (dist2D < minDist) { minDist = dist2D; closestDef = d; }
                    
                    if (d.group.position.z < playerPos.z && dist2D < minGoalSideDist) {
                        minGoalSideDist = dist2D; closestGoalSideDef = d;
                    }
                    if (d.group.position.z < lastDefenderZ) lastDefenderZ = d.group.position.z;
                });

                let offsideLineZ = Math.min(playerPos.z, lastDefenderZ);

                if (oppGoalKeeper) oppGoalKeeper.update(dt, timeSec, isBallInFlight, playerPos, false, offsideLineZ, yaw, false);
                teammates.forEach(t => t.update(dt, timeSec, isBallInFlight, playerPos, false, offsideLineZ, yaw, false));
                
                // Decide who presses the ball carrier — capped, so you don't get swarmed by
                // half the defense at once. Anyone not in the pressing group gets assigned to
                // man-mark a specific attacker instead (see below).
                const MAX_PRESSERS = 2;
                let pressCandidates = [];
                defenders.forEach(d => {
                    let dist = d.group.position.distanceTo(playerPos);
                    let priority = null; // lower = presses first

                    if (d === closestDef) {
                        let engagementDist = currentDefensiveStyle === 'SPACE' ? 15 : Infinity;
                        if (dist < engagementDist) priority = 0;
                    }
                    if (closestDef && closestDef.group.position.z > playerPos.z + 0.5 && d === closestGoalSideDef) {
                        priority = priority === null ? 1 : priority;
                    }
                    if (dist < 8.0 && d.group.position.z < playerPos.z + 1.0) {
                        priority = priority === null ? 2 : priority;
                    }
                    if (priority !== null) pressCandidates.push({ d, priority, dist });
                });
                pressCandidates.sort((a, b) => a.priority - b.priority || a.dist - b.dist);
                let pressingSet = new Set(pressCandidates.slice(0, MAX_PRESSERS).map(c => c.d));
                defenders.forEach(d => { d.__shouldPress = pressingSet.has(d); });

                // Man-marking: give every non-pressing defender their own attacking teammate to
                // track and block the passing lane to, via exclusive nearest-pair assignment, so
                // coverage spreads across your options instead of everyone clumping on one man.
                let markableTeammates = teammates.filter(t => t.role !== 'myGoalie');
                let markers = defenders.filter(d => !d.__shouldPress);
                let candidatePairs = [];
                markers.forEach(d => {
                    markableTeammates.forEach(t => {
                        candidatePairs.push({ d, t, dist: d.group.position.distanceTo(t.group.position) });
                    });
                });
                candidatePairs.sort((a, b) => a.dist - b.dist);
                let assignedDefenders = new Set(), assignedTeammates = new Set();
                candidatePairs.forEach(pair => {
                    if (assignedDefenders.has(pair.d) || assignedTeammates.has(pair.t)) return;
                    pair.d.__markTarget = pair.t.group.position;
                    assignedDefenders.add(pair.d); assignedTeammates.add(pair.t);
                });
                markers.forEach(d => { if (!assignedDefenders.has(d)) d.__markTarget = null; });

                // When several defenders press at once, spread them around the player instead of
                // letting them all converge on the exact same point (which is what caused them to
                // stack on top of each other). Angles are assigned in the defenders' current bearing
                // order around the player so they settle into position smoothly, not by teleporting.
                let pressingDefs = defenders.filter(d => d.__shouldPress);
                if (pressingDefs.length > 1) {
                    pressingDefs.sort((a, b) => {
                        let angA = Math.atan2(a.group.position.x - playerPos.x, a.group.position.z - playerPos.z);
                        let angB = Math.atan2(b.group.position.x - playerPos.x, b.group.position.z - playerPos.z);
                        return angA - angB;
                    });
                    let baseAngle = Math.atan2(pressingDefs[0].group.position.x - playerPos.x, pressingDefs[0].group.position.z - playerPos.z);
                    pressingDefs.forEach((d, i) => {
                        d.__pressAngle = baseAngle + (i * (Math.PI * 2 / pressingDefs.length));
                    });
                } else if (pressingDefs.length === 1) {
                    pressingDefs[0].__pressAngle = null; // lone presser goes straight at the player as before
                }

                defenders.forEach(d => { 
                    let shouldPress = d.__shouldPress;
                    let isClosestToBall = (d === closestDefToBall);
                    let pressAngle = shouldPress ? (d.__pressAngle ?? null) : null;
                    let markTarget = shouldPress ? null : (d.__markTarget ?? null);

                    d.update(dt, timeSec, isBallInFlight, playerPos, shouldPress, offsideLineZ, yaw, isClosestToBall, pressAngle, markTarget);
                    
                    // Added check for tackleImmunityTimer to prevent instantaneous tackles on acquisition
                    let distToPlayer = d.group.position.distanceTo(playerPos);
                    if (distToPlayer < 1.2 && !isBallInFlight && !isReceivingPass && tackleImmunityTimer <= 0) {
                        let heldTime = (20.0 - matchClock).toFixed(1);
                        triggerFeedback("TACKLED!", "DEFENDER CAUGHT YOU", `HELD BALL FOR: ${heldTime}s`, "#ff2222");
                    }
                });

                // Hard safety net: whatever the reason (pressing overlap, both defenders shadowing
                // the same passing lane, formation drift), never let two defenders' bodies overlap.
                const MIN_DEFENDER_SPACING = 1.5;
                for (let i = 0; i < defenders.length; i++) {
                    for (let j = i + 1; j < defenders.length; j++) {
                        let a = defenders[i].group.position, b = defenders[j].group.position;
                        let dx = a.x - b.x, dz = a.z - b.z;
                        let dist = Math.hypot(dx, dz);
                        if (dist < 0.001) {
                            // exactly coincident: nudge apart deterministically so they don't jitter forever
                            let ang = (i * 2.399 + j * 1.117);
                            a.x += Math.cos(ang) * MIN_DEFENDER_SPACING * 0.5;
                            a.z += Math.sin(ang) * MIN_DEFENDER_SPACING * 0.5;
                            b.x -= Math.cos(ang) * MIN_DEFENDER_SPACING * 0.5;
                            b.z -= Math.sin(ang) * MIN_DEFENDER_SPACING * 0.5;
                        } else if (dist < MIN_DEFENDER_SPACING) {
                            let overlap = (MIN_DEFENDER_SPACING - dist) * 0.5;
                            let nx = dx / dist, nz = dz / dist;
                            a.x += nx * overlap; a.z += nz * overlap;
                            b.x -= nx * overlap; b.z -= nz * overlap;
                        }
                    }
                }
            }

            let idealCamPos = playerPos.clone().add(new THREE.Vector3(0, 1.8, 0));
            let speedRatio = playerVel.length() / 14; idealCamPos.y += Math.sin(timeSec * 15) * (0.15 * speedRatio);
            cameraTargetPos.lerp(idealCamPos, 15 * dt); camera.position.copy(cameraTargetPos);
            
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        resetGame(); animate(performance.now());
    </script>
</body>
</html>
